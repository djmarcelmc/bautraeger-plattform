# Produktivbetrieb auf einem vServer:  docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# Öffentlich erreichbar ist nur Caddy (Port 80/443). API, Web und Datenbank laufen im internen Netz.
name: bautraeger

x-node-build: &node-build
  context: .
  args:
    NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16}
    restart: unless-stopped
    environment:
      POSTGRES_USER: bt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}
      POSTGRES_DB: bautraeger
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bt -d bautraeger"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: { <<: *node-build, target: api }
    image: bautraeger-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://bt:${POSTGRES_PASSWORD}@db:5432/bautraeger
      MIGRATE_ON_START: "true"
      PUBLIC_URL: https://${DOMAIN}
      # true = Rollen aus der Microsoft-Anmeldung werden geprüft (zusammen mit den AUTH_*-Werten der Weboberfläche)
      AUTH_AKTIV: ${AUTH_AKTIV:-false}
      # E-Mail-Versand (leer = nur protokollieren), siehe docs/deployment.md
      MAIL_ABSENDER: ${MAIL_ABSENDER:-}
      MAIL_GRAPH_TENANT: ${MAIL_GRAPH_TENANT:-}
      MAIL_GRAPH_CLIENT_ID: ${MAIL_GRAPH_CLIENT_ID:-}
      MAIL_GRAPH_SECRET: ${MAIL_GRAPH_SECRET:-}
      MAIL_SMTP_URL: ${MAIL_SMTP_URL:-}
    volumes:
      - dokumente:/data/dokumente
    depends_on:
      db: { condition: service_healthy }

  web:
    build: { <<: *node-build, target: web }
    image: bautraeger-web
    restart: unless-stopped
    environment:
      API_URL: http://api:3001
      # Öffentliche Adresse für Links im Käuferportal
      PUBLIC_URL: https://${DOMAIN}
      # Microsoft-Anmeldung (leer = aus), siehe docs/microsoft-entra-app-registrierung.md
      AUTH_URL: https://${DOMAIN}
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_MICROSOFT_ENTRA_ID_ID: ${AUTH_MICROSOFT_ENTRA_ID_ID:-}
      AUTH_MICROSOFT_ENTRA_ID_SECRET: ${AUTH_MICROSOFT_ENTRA_ID_SECRET:-}
      AUTH_MICROSOFT_ENTRA_ID_ISSUER: ${AUTH_MICROSOFT_ENTRA_ID_ISSUER:-}
    depends_on:
      api: { condition: service_healthy }

  caddy:
    image: ${CADDY_IMAGE:-caddy:2}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN fehlt}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL fehlt}
      # nur für die Variante mit Passwortschutz (deploy/Caddyfile)
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-bautraeger}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:-}
    volumes:
      # Caddyfile = Passwortschutz (Übergang), Caddyfile.entra = Microsoft-Anmeldung
      - ./deploy/${CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: { condition: service_healthy }

  backup:
    image: ${POSTGRES_IMAGE:-postgres:16}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: bt
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: bautraeger
      BACKUP_TAGE: ${BACKUP_TAGE:-14}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - dokumente:/data/dokumente:ro
      - ./backups:/backups
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
  dokumente:
  caddy_data:
  caddy_config:
